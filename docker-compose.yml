services:
  backend:
    build: ./backend
    container_name: audit-skills-backend
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      USE_BEDROCK: ${USE_BEDROCK:-false}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
    volumes:
      # Mount skills as read-write so authoring persists across container restarts
      - ./backend/skills:/app/skills
      - ./backend/audit.log.jsonl:/app/audit.log.jsonl
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build: ./frontend
    container_name: audit-skills-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
